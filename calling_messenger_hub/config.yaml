name: "Calling Messenger Hub"
version: "0.19.5"
slug: "calling_messenger_hub"
description: "Trung tâm gọi và tin nhắn đa dịch vụ cho Home Assistant. Hỗ trợ Telegram (tin nhắn/ảnh/voice TTS, gọi P2P), Discord/Signal (chuông TTS lặp), LINE Official Account (tin nhắn/ảnh qua Messaging API), Zalo cá nhân (đăng nhập QR, nhắn tin văn bản, gửi ảnh/voice TTS, đổ chuông và phát TTS một chiều) mô-đun SIM 4G SIMCom A7670C-LANS/Quectel EC20/EC2x (gọi cảnh báo và phát TTS một chiều, gửi/đọc SMS, xem sóng/số dư/hạn dùng qua USSD và đọc OTP), cùng trung tâm báo động có chính sách leo thang từ dịch vụ IoT sang SIM 4G, xác nhận và lịch sử."
url: "https://github.com/trankhanhduy2929-beep/my_hass_addon_public"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3030
uart: true
kernel_modules: true
panel_icon: "mdi:phone-in-talk"
panel_title: "Calling Messenger Hub"
panel_admin: true
ports:
  3030/tcp: 3030
ports_description:
  3030/tcp: "REST API (cần API token)"
watchdog: "http://[HOST]:[PORT:3030]/health"
options:
  api_token: ""
  api_id: 0
  api_hash: ""
  tts_voice: "vi-VN-HoaiMyNeural"
  tts_rate: "+0%"
  tts_cache: true
  ring_timeout: 45
  ring_attempts: 2
  ring_interval: 15
  max_call_seconds: 180
  log_limit: 300
  mqtt_enabled: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_topic_prefix: "calling_messenger_hub"
  mqtt_discovery_prefix: "homeassistant"
  license_key: ""
  license_server_url: "https://calling-messenger-hub-license.vercel.app"
  license_site_url: "https://calling-messenger-hub-license.vercel.app"
schema:
  api_token: "password?"
  api_id: "int(0,)?"
  api_hash: "password?"
  tts_voice: "str?"
  tts_rate: "str?"
  tts_cache: "bool?"
