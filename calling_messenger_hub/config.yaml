name: "Calling Messenger Hub"
version: "0.24.11"
slug: "calling_messenger_hub"
description: "Trung tâm gọi và tin nhắn đa dịch vụ cho Home Assistant. Hỗ trợ Telegram (tin nhắn/ảnh/voice TTS, gọi P2P), Discord/Signal (chuông TTS lặp), LINE Official Account (tin nhắn/ảnh qua Messaging API), Zalo cá nhân (đăng nhập QR, nhắn tin văn bản, gửi ảnh/voice TTS, đổ chuông và phát TTS một chiều) mô-đun SIM 4G SIMCom A7670C-LANS/Quectel EC20/EC2x (gọi cảnh báo và phát TTS một chiều, gửi/đọc SMS, xem sóng, đọc OTP, xem số dư/hạn dùng qua USSD chỉ trên Quectel EC20/EC2x), cùng trung tâm báo động có chính sách leo thang từ dịch vụ IoT sang SIM 4G, xác nhận và lịch sử."
url: "https://github.com/trankhanhduy2929-beep/my_hass_addon_public"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3030
homeassistant_api: true
uart: true
kernel_modules: true
panel_icon: "mdi:phone-in-talk"
panel_title: "Calling Messenger Hub"
panel_admin: true
ports:
  3030/tcp: 3030
ports_description:
  3030/tcp: "REST API (cần API token)"
watchdog: "http://[HOST]:[PORT:3030]/health"
image: "ghcr.io/trankhanhduy2929-beep/calling_messenger_hub"
