name: "Calling Messenger Hub"
version: "0.2.8"
slug: "calling_messenger_hub"
description: "Trung tâm gọi và tin nhắn đa dịch vụ cho Home Assistant. Hiện hỗ trợ Telegram: nhiều tài khoản, tin nhắn/ảnh/voice TTS và gọi P2P."
url: "https://github.com/trankhanhduy2929-beep/my_hass_addon_public"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3030
panel_icon: "mdi:phone-in-talk"
panel_title: "Calling Messenger Hub"
panel_admin: true
ports:
  3030/tcp: 3030
ports_description:
  3030/tcp: "REST API (cần API token)"
watchdog: "http://[HOST]:[PORT:3030]/health"
options:
  api_token: ""
  api_id: 0
  api_hash: ""
  tts_voice: "vi-VN-HoaiMyNeural"
  tts_rate: "+0%"
  tts_cache: true
  ring_timeout: 45
  ring_attempts: 2
  ring_interval: 15
  max_call_seconds: 180
  log_limit: 300
  license_key: ""
  license_server_url: "https://calling-messenger-hub-license.vercel.app"
  license_site_url: "https://calling-messenger-hub-license.vercel.app"
schema:
  api_token: "password?"
  api_id: "int(0,)?"
  api_hash: "password?"
  tts_voice: "str?"
  tts_rate: "str?"
  tts_cache: "bool?"
  ring_timeout: "int(10,180)?"
  ring_attempts: "int(1,10)?"
  ring_interval: "int(0,600)?"
  max_call_seconds: "int(10,900)?"
  log_limit: "int(50,2000)?"
  license_key: "password?"
  license_server_url: "url?"
  license_site_url: "url?"
image: "ghcr.io/trankhanhduy2929-beep/calling_messenger_hub"
