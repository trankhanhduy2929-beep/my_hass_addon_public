name: "Calling Messenger Hub"
version: "0.12.1"
slug: "calling_messenger_hub"
description: "Trung tâm gọi và tin nhắn đa dịch vụ cho Home Assistant. Hỗ trợ Telegram (tin nhắn/ảnh/voice TTS, gọi P2P), Discord/Signal (chuông TTS lặp), LINE Official Account (tin nhắn/ảnh qua Messaging API), Zalo cá nhân (đăng nhập QR, nhắn tin văn bản) và mô-đun SIM 4G SIMCom A7670C-LANS/Quectel EC20/EC2x (gọi thoại thật, phát TTS khi nghe máy, xem sóng/số dư/hạn dùng qua USSD và đọc SMS/OTP)."
url: "https://github.com/trankhanhduy2929-beep/my_hass_addon_public"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 3030
uart: true
panel_icon: "mdi:phone-in-talk"
panel_title: "Calling Messenger Hub"
panel_admin: true
ports:
  3030/tcp: 3030
ports_description:
  3030/tcp: "REST API (cần API token)"
watchdog: "http://[HOST]:[PORT:3030]/health"
options:
  api_token: ""
  api_id: 0
  api_hash: ""
  tts_voice: "vi-VN-HoaiMyNeural"
  tts_rate: "+0%"
  tts_cache: true
  ring_timeout: 45
  ring_attempts: 2
  ring_interval: 15
  max_call_seconds: 180
  log_limit: 300
  license_key: ""
  license_server_url: "https://calling-messenger-hub-license.vercel.app"
  license_site_url: "https://calling-messenger-hub-license.vercel.app"
schema:
  api_token: "password?"
  api_id: "int(0,)?"
  api_hash: "password?"
  tts_voice: "str?"
  tts_rate: "str?"
  tts_cache: "bool?"
  ring_timeout: "int(10,180)?"
  ring_attempts: "int(1,10)?"
  ring_interval: "int(0,600)?"
  max_call_seconds: "int(10,900)?"
  log_limit: "int(50,2000)?"
  license_key: "password?"
  license_server_url: "url?"
  license_site_url: "url?"
image: "ghcr.io/trankhanhduy2929-beep/calling_messenger_hub"
