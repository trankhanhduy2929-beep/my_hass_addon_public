configuration:
  auth_enabled:
    name: Yêu cầu đăng nhập
    description: Bắt đăng nhập bằng tài khoản trước khi mở giao diện LiteNVR.
  username:
    name: Tài khoản
    description: Tên đăng nhập giao diện web.
  password:
    name: Mật khẩu
    description: Mật khẩu đăng nhập giao diện web. Bắt buộc, tối thiểu 12 ký tự và không dùng mật khẩu đã lộ trong các vụ rò rỉ.
  iframe:
    name: Cho phép nhúng
    description: Cho phép nhúng giao diện LiteNVR vào iframe / thẻ dashboard.
  timezone:
    name: Múi giờ
    description: Múi giờ IANA tuỳ chọn, ví dụ Asia/Ho_Chi_Minh. Trống dùng múi giờ host.
  log_level:
    name: Mức log
    description: Độ chi tiết log của máy chủ web LiteNVR.
  go2rtc:
    name: Chế độ go2rtc
    description: auto dùng go2rtc kèm sẵn khi có, on bật bắt buộc, off tắt.
  ffmpeg_threads:
    name: Số luồng FFmpeg
    description: Số luồng cấp cho mỗi tiến trình FFmpeg.
  live_max_height:
    name: Chiều cao xem trực tiếp tối đa
    description: Hạ chiều cao khung xem trực tiếp theo pixel. 0 giữ nguyên độ phân giải.
  storage_location:
    name: Nơi lưu trữ
    description: Nơi LiteNVR lưu cấu hình và bản ghi (data, media hoặc share).
network:
  3333/tcp: Giao diện web LiteNVR (mở trực tiếp ngoài Home Assistant).
