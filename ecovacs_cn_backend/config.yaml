name: Ecovacs China Backend
version: 1.2.21
slug: ecovacs_cn_backend
description: Secure multi-account Ecovacs China/international cloud and MQTT backend
url: "https://github.com/trankhanhduy2929-beep/my_hass_addon_public"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 4545
panel_icon: mdi:robot-vacuum
panel_title: Ecovacs Backend
webui: http://[HOST]:[PORT:4545]
watchdog: http://[HOST]:[PORT:4545]/health
services:
  - mqtt:want
ports:
  4545/tcp: null
ports_description:
  4545/tcp: API nội bộ; chỉ ánh xạ ra host khi thật sự cần
options:
  log_level: info
  map_refresh_interval: 5
  state_refresh_interval: 120
  settings_refresh_interval: 600
  diagnostic_refresh_interval: 1200
  mqtt_enabled: true
  mqtt_map_enabled: true
  mqtt_map_min_interval: 5
  mqtt_map_max_bytes: 2000000
  mqtt_batch_window_ms: 350
schema:
  log_level: list(debug|info|warning|error)
  map_refresh_interval: int(3,60)
  state_refresh_interval: int(15,300)
  settings_refresh_interval: int(300,1800)
  diagnostic_refresh_interval: int(900,3600)
  mqtt_enabled: bool
  mqtt_map_enabled: bool
  mqtt_map_min_interval: int(1,60)
  mqtt_map_max_bytes: int(64000,10000000)
  mqtt_batch_window_ms: int(100,2000)
apparmor: true
host_network: false
privileged: []
image: "ghcr.io/trankhanhduy2929-beep/ecovacs_cn_backend"
