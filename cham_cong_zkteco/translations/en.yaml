configuration:
  zk_ip:
    name: "Attendance device IP"
    description: "IPv4 address of the ZKTeco device on the LAN"
  zk_port:
    name: "Device port"
    description: "The ZKTeco default is 4370"
  zk_password:
    name: "Communication password"
    description: "Device communication password, commonly 0"
  zk_timeout:
    name: "Connection timeout"
    description: "Seconds to wait for each device response"
  force_udp:
    name: "Force UDP"
    description: "Enable when the device cannot communicate over TCP"
  omit_ping:
    name: "Skip ping"
    description: "Enable when ICMP is blocked on the network"

